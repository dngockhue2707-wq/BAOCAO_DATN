
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả thanh toán | DNK Hotel</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/deposit.css">
    <script src="/js/layout.js" defer></script>
    <script src="/js/payment-result.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <main class="deposit-page">
        <section class="deposit-container">
            <span class="deposit-eyebrow">DNK HOTEL · VNPAY SANDBOX</span>
            <h1>Kết quả thanh toán</h1>

            <div class="deposit-card">
                <h2 id="paymentTitle">Đang kiểm tra giao dịch...</h2>
                <p id="paymentDescription"></p>
                <p id="paymentAmount"></p>
                <button type="button" id="checkPayment" class="deposit-pay">
                    Kiểm tra lại trạng thái
                </button>
            </div>

            <a class="deposit-back" href="/deposit.html">
                Quay lại trang đặt cọc
            </a>
        </section>
    </main>

    <div id="site-footer"></div>
</body>
</html>
