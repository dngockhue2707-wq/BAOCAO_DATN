
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm phòng trống | DNK Hotel</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/availability.css">
    <script src="/js/layout.js" defer></script>
    <script src="/js/account-nav.js" defer></script>
    <script src="/js/availability.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <main class="availability-page">
        <div class="availability-container">
            <div class="availability-heading">
                <span>DNK HOTEL</span>
                <h1>Tìm phòng còn trống</h1>
                <p>
                    Lựa chọn thời gian lưu trú và số lượng khách
                    để tìm phòng phù hợp với nhu cầu của bạn.
                </p>
            </div>

            <form id="availabilityForm" class="availability-form">
                <div class="availability-field">
                    <label for="checkIn">Ngày nhận phòng</label>
                    <input id="checkIn" type="date" required>
                </div>

                <div class="availability-field">
                    <label for="checkOut">Ngày trả phòng</label>
                    <input id="checkOut" type="date" required>
                </div>

                <div class="availability-field">
                    <label for="adults">Người lớn</label>
                    <select id="adults" required>
                        <option value="1">1 người</option>
                        <option value="2" selected>2 người</option>
                        <option value="3">3 người</option>
                        <option value="4">4 người</option>
                        <option value="5">5 người</option>
                        <option value="6">6 người</option>
                    </select>
                </div>

                <div class="availability-field">
                    <label for="children">Trẻ em</label>
                    <select id="children">
                        <option value="0" selected>Không có</option>
                        <option value="1">1 trẻ em</option>
                        <option value="2">2 trẻ em</option>
                        <option value="3">3 trẻ em</option>
                        <option value="4">4 trẻ em</option>
                    </select>
                </div>

                <button type="submit" id="searchAvailability">
                    Tìm phòng trống
                </button>
            </form>

            <p id="availabilityMessage" role="status" aria-live="polite"></p>

            <div class="availability-results-heading">
                <h2>Danh sách phòng còn trống</h2>
                <span id="availabilityCount"></span>
            </div>

            <div id="availabilityResults" class="availability-grid"></div>
        </div>
    </main>

    <div id="site-footer"></div>
</body>
</html>
