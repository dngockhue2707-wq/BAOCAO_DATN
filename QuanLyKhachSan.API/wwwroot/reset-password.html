
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | KS Hotel</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/password-recovery.css">

    <script src="/js/layout.js" defer></script>
    <script src="/js/account-nav.js" defer></script>
    <script src="/js/reset-password.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <main class="login-layout">
        <section class="login-intro">
            <span class="eyebrow">
                KS HOTEL · ACCOUNT SECURITY
            </span>

            <h1>
                Khởi đầu mới,
                <em>an tâm hơn.</em>
            </h1>

            <p>
                Tạo mật khẩu mới để tiếp tục sử dụng
                tài khoản KS Hotel của bạn.
            </p>
        </section>

        <section class="login-card">
            <div class="card-heading">
                <span class="eyebrow">BẢO MẬT TÀI KHOẢN</span>
                <h2>Đặt lại mật khẩu</h2>
                <p>
                    Mật khẩu mới phải có từ 12 đến 128 ký tự.
                </p>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">
                        Mật khẩu mới
                    </label>

                    <input
                        id="newPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="12"
                        maxlength="128"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Xác nhận mật khẩu
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="12"
                        maxlength="128"
                        required>
                </div>

                <p class="recovery-message"
                   id="resetMessage"
                   role="status"
                   aria-live="polite"></p>

                <button
                    class="submit-button"
                    id="resetButton"
                    type="submit">
                    Cập nhật mật khẩu →
                </button>
            </form>

            <p class="register-link">
                <a href="/login.html">
                    Quay lại đăng nhập
                </a>
            </p>
        </section>
    </main>

    <div id="site-footer"></div>
</body>
</html>
